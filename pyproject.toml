[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "promptstrike"
version = "0.0.1"
description = "Black-box LLM red-teaming scanner for the OWASP LLM Top 10 (2025)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Prashik Kamble" }]
keywords = ["llm", "security", "red-team", "owasp", "mitre-atlas"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "rich>=13.7",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
promptstrike = "promptstrike.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/promptstrike"]
# Jinja2 templates live inside the package; ship them (not just .py files).
artifacts = ["src/promptstrike/report/templates/*.j2"]

# The probe library and config data live at the repo root for easy editing;
# force-include them under the package as promptstrike/_data/ so they ship in
# the wheel. util.paths.data_dir() resolves this packaged copy at runtime.
[tool.hatch.build.targets.wheel.force-include]
"probes" = "promptstrike/_data/probes"
"configs" = "promptstrike/_data/configs"

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
